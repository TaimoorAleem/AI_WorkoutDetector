# Proprio local stack (docs/specs/phase5-services.md section 5).
#
#   docker compose -f deploy/compose.yaml up --build -d --wait
#
# Works with no setup: every credential below has a dev-only default. Copy .env.example to
# deploy/.env to change them. See deploy/README.md.
name: proprio

x-dev-credentials:
  # Dev-only values, not secrets. Override through deploy/.env.
  postgres-password: &postgres-password ${POSTGRES_PASSWORD:-proprio-dev-pg}
  rabbit-password: &rabbit-password ${RABBIT_PASSWORD:-proprio-dev-mq}
  s3-access-key: &s3-access-key ${S3_ACCESS_KEY:-proprio}
  s3-secret-key: &s3-secret-key ${S3_SECRET_KEY:-proprio-dev-s3}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: proprio
      POSTGRES_USER: proprio
      POSTGRES_PASSWORD: *postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proprio -d proprio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: proprio
      RABBITMQ_DEFAULT_PASS: *rabbit-password
    ports:
      - "127.0.0.1:${RABBIT_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # MinIO's community image is gone from Docker Hub; Chainguard's build is distroless and runs as
  # uid 65532, so it has no shell and no healthcheck. `createbuckets` waits for it instead.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: *s3-access-key
      MINIO_ROOT_PASSWORD: *s3-secret-key
    ports:
      # Bound to the host so presigned URLs (signed for S3_PUBLIC_ENDPOINT) work from there.
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # One-shot: create the raw-session bucket. `restart: on-failure` retries until MinIO answers.
  # MC_HOST_<alias> defines the alias, so no shell is needed (the image has none).
  createbuckets:
    image: cgr.dev/chainguard/minio-client:latest
    command: ["mb", "--ignore-existing", "minio/${S3_BUCKET:-proprio-raw}"]
    environment:
      MC_HOST_minio: http://${S3_ACCESS_KEY:-proprio}:${S3_SECRET_KEY:-proprio-dev-s3}@minio:9000
    depends_on:
      - minio
    restart: on-failure

  # One-shot: make sure a model exists. When ${MODEL_DIR} is unset this trains the throwaway
  # SYNTHETIC fixture (metadata name "synthetic-fixture") into a volume; a real bundle mounted
  # through MODEL_DIR is left alone (--if-missing).
  model-init:
    build:
      context: ..
      dockerfile: services/inference/Dockerfile
    image: proprio/inference:dev
    entrypoint: ["python", "-m", "proprio_inference.train_model"]
    command: ["--out", "/models/proprio-classifier", "--synthetic", "--if-missing"]
    volumes:
      - ${MODEL_DIR:-model-data}:/models
    restart: "no"

  core-api:
    build:
      context: ..
      dockerfile: services/core-api/Dockerfile
    image: proprio/core-api:dev
    environment:
      # `dev` generates an ephemeral RS256 key at startup (tokens die with the container) and
      # serves /swagger-ui.html. Any other profile needs JWT_PRIVATE_KEY or JWT_PRIVATE_KEY_PATH.
      SPRING_PROFILES_ACTIVE: ${CORE_API_PROFILE:-dev}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      DB_URL: jdbc:postgresql://postgres:5432/proprio
      DB_USER: proprio
      DB_PASSWORD: *postgres-password
      RABBIT_HOST: rabbitmq
      RABBIT_USER: proprio
      RABBIT_PASSWORD: *rabbit-password
      # core-api talks to MinIO by its service name, but presigned URLs are handed to the client
      # (the E2E suite, a phone), which reaches MinIO as S3_PUBLIC_ENDPOINT.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-proprio-raw}
      S3_ACCESS_KEY: *s3-access-key
      S3_SECRET_KEY: *s3-secret-key
    ports:
      - "127.0.0.1:${CORE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped

  inference:
    build:
      context: ..
      dockerfile: services/inference/Dockerfile
    image: proprio/inference:dev
    environment:
      APP_ENV: dev
      AMQP_URL: amqp://proprio:${RABBIT_PASSWORD:-proprio-dev-mq}@rabbitmq:5672/%2F
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-proprio-raw}
      S3_ACCESS_KEY: *s3-access-key
      S3_SECRET_KEY: *s3-secret-key
      MODEL_URI: /models/proprio-classifier
      # The golden session was recorded by a "synthetic-watch"; map it to the prior profile so the
      # E2E suite can analyse it. Real watches (SM-R920) keep the production mapping.
      PROFILE_MAP: ${PROFILE_MAP:-SM-R920=galaxy-watch5pro-fit-v1|galaxy-watch-prior-v0,synthetic-watch=galaxy-watch-prior-v0}
    ports:
      - "127.0.0.1:${INFERENCE_PORT:-8000}:8000"
    volumes:
      - ${MODEL_DIR:-model-data}:/models:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # MLflow tracking server (Postgres + MinIO) is deferred: the Phase 5 services don't need it.

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  model-data:
