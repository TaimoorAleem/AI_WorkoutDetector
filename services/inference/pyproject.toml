[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proprio-inference"
version = "0.1.0"
description = "Proprio inference service: consumes session.uploaded, publishes session.analyzed"
requires-python = ">=3.11,<3.12"
dependencies = [
    "workout-ml",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pika>=1.3",
    "boto3>=1.34",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "testcontainers>=4.8",
    "ruff>=0.5",
]

# workout-ml is a path dependency for uv. pip and the Docker build install it separately with
# `pip install ml/ --no-deps`, so the lock files do not contain it (see README).
[tool.uv.sources]
workout-ml = { path = "../../ml" }

[tool.setuptools.packages.find]
include = ["proprio_inference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (Testcontainers RabbitMQ + MinIO); skipped without it"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
