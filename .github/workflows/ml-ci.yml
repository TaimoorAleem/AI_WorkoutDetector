name: ml-ci

on:
  push:
    branches: [dev, main]
    paths:
      - "ml/**"
      - "protocol/**"
      - ".github/workflows/ml-ci.yml"
      - "data/raw/*.dvc"
  pull_request:
    branches: [dev, main]
    paths:
      - "ml/**"
      - "protocol/**"
      - ".github/workflows/ml-ci.yml"
      - "data/raw/*.dvc"

permissions:
  contents: read

concurrency:
  group: ml-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.lock
            ml/requirements-dev.lock

      - name: Install dependencies
        run: |
          pip install -r ml/requirements-dev.lock
          pip install -e ml --no-deps

      - name: Lint
        run: ruff check ml

      - name: Format check
        run: ruff format --check ml

      - name: Test
        run: pytest ml/tests -q --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
